{{- if .Values.secret.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "muffin-wallet-chart.fullname" . }}
  labels:
    {{- include "muffin-wallet-chart.labels" . | nindent 4 }}
type: Opaque
data:
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secret.databasePassword | b64enc | quote }}
{{- end }}
