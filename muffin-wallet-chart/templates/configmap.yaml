{{- if .Values.config.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "muffin-wallet-chart.fullname" . }}
  labels:
    {{- include "muffin-wallet-chart.labels" . | nindent 4 }}
data:
  application.yaml: {{ .Values.config.applicationYaml | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "muffin-wallet-chart.fullname" . }}-env
  labels:
    {{- include "muffin-wallet-chart.labels" . | nindent 4 }}
data:
  JDK_JAVA_OPTIONS: {{ .Values.config.jdkJavaOptions | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config-muffin-wallet
  labels:
    {{- include "muffin-wallet-chart.labels" . | nindent 4 }}
data:
  promtail.yaml: |
    server:
      http_listen_port: 3101
      grpc_listen_port: 0

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: app-logs

        pipeline_stages:
          - regex:
              expression: '\[(?P<traceId>[a-f0-9]{16,32})[-,]'
          - labels:
              traceId:
          - regex:
              expression: '(?P<logLevel>INFO|ERROR|WARN|DEBUG)'
          - labels:
              logLevel:

        static_configs:
          - targets:
              - localhost
            labels:
              job: muffin-wallet
              namespace: muffin
              __path__: /logs/*.log
{{- end }}
